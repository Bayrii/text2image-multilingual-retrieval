data:
  max_images: 5000
  languages:
    - en
    - ar
    - zh
    - fr
    - de
    - ru
  val_split: 0.1
  test_split: 0.1
  image_size: 224
  root_dir: "E:/Coding/text2Image"
  images_dir: "E:/Coding/text2Image/data/images"
  raw_dir: "E:/Coding/text2Image/data/raw"
  processed_dir: "E:/Coding/text2Image/data/processed"
  captions_en: "E:/Coding/text2Image/data/processed/captions_en.json"
  captions_multilingual: "E:/Coding/text2Image/data/processed/captions_multilingual.json"
  dataset_csv: "E:/Coding/text2Image/data/processed/dataset.csv"
  dataset_parquet: "E:/Coding/text2Image/data/processed/dataset.parquet"
  splits_json: "E:/Coding/text2Image/data/processed/splits.json"

model:
  mclip_model: "M-CLIP/XLM-Roberta-Large-Vit-B-32"
  clip_visual: "openai/clip-vit-base-patch32"
  embedding_dim: 512
  freeze_visual_encoder: true
  # Freeze the first N transformer layers of XLM-R-Large (24 total).
  # v2: freeze 16 leaves top 8 layers + projection trainable (~110M params)
  # for more capacity; v1 had freeze=20 (~52M trainable).
  freeze_text_layers_below: 16
  gradient_checkpointing: true

training:
  # Tuned for RTX 3060 Laptop (6 GB VRAM). With freeze_text_layers_below=20,
  # only ~55M params are trainable. Effective batch = 8 * 16 = 128.
  batch_size: 8
  learning_rate: 1.0e-5
  warmup_steps: 300
  max_epochs: 15
  gradient_accumulation_steps: 16
  mixed_precision: true
  temperature: 0.07
  hard_negatives_per_sample: 1
  checkpoint_every_n_epochs: 2
  early_stopping_patience: 4
  num_workers: 0          # Windows DataLoader is fragile with workers > 0
  weight_decay: 0.01
  max_grad_norm: 1.0
  log_every_n_steps: 20
  checkpoints_dir: "E:/Coding/text2Image/checkpoints"
  log_csv: "E:/Coding/text2Image/checkpoints/training_log.csv"

retrieval:
  faiss_index_type: "flat_ip"
  top_n_stage1: 100
  top_k_stage2: 5
  index_path: "E:/Coding/text2Image/embeddings/image.index"
  meta_path: "E:/Coding/text2Image/embeddings/image_meta.json"
  text_index_path: "E:/Coding/text2Image/embeddings/text.index"
  text_meta_path: "E:/Coding/text2Image/embeddings/text_meta.json"
  image_emb_path: "E:/Coding/text2Image/embeddings/image_embeddings.npy"
  text_emb_path: "E:/Coding/text2Image/embeddings/text_embeddings.npy"

evaluation:
  recall_at_k: [1, 5, 10]
  map_at_k: 10
  reports_dir: "E:/Coding/text2Image/reports"

api:
  host: "0.0.0.0"
  port: 8000
  max_results: 20
